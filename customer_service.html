<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Console | Bold.ng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Link your central layout stylesheet -->
<link rel="stylesheet" href="styles.css">


</head>
<body class="flex">

    <!-- SIDEBAR: TICKET LIST -->
    <aside class="w-80 border-r border-white/5 flex flex-col glass-card h-screen">
        <div class="p-6 border-b border-white/5">
            <h1 class="text-xl font-black tracking-tighter bold">BOLD<span class="text-orange-800">.ng</span></h1>
            <div class="flex gap-2 mt-4">
                <div class="flex-1 text-center p-2 rounded-lg bg-white/5">
                    <p class="text-[8px] text-orange-600 font-bold uppercase">Awaiting</p>
                    <p id="count-awaiting" class="text-sm font-black">0</p>
                </div>
                <div class="flex-1 text-center p-2 rounded-lg bg-white/5">
                    <p class="text-[8px] text-orange-800 font-bold uppercase">Solved</p>
                    <p id="count-solved" class="text-sm font-black">0</p>
                </div>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="flex text-[9px] font-black uppercase tracking-widest border-b border-white/5">
            <button onclick="renderTicketList('awaiting')" class="flex-1 py-3 hover:bg-white/5 border-b-2 border-orange-600">Open</button>
            <button onclick="renderTicketList('solved')" class="flex-1 py-3 hover:bg-white/5 text-gray-500">History</button>
        </div>

        <div id="ticket-list" class="flex-1 overflow-y-auto custom-scroll">
            <!-- Tickets injected here -->
            <div class="p-10 text-center text-[10px] text-gray-600 uppercase font-bold">No active logs</div>
        </div>
    </aside>

    <!-- MAIN INTERFACE -->
    <main class="flex-1 flex flex-col">
        <header class="h-20 border-b border-white/5 flex items-center justify-between px-10 glass-card">
            <div class="flex items-center gap-4">
                <div id="status-indicator" class="status-dot bg-gray-600"></div>
                <div>
                    <h2 id="ticket-header-title" class="text-[10px] font-black uppercase tracking-widest text-gray-400 italic">Select a ticket to begin</h2>
                    <p id="ticket-header-sub" class="text-[10px] text-blue-500 font-bold hidden">AGENT CONNECTED</p>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="resolveCurrentTicket()" class="bg-orange-600/10 text-green-500 border border-orange-600/20 px-6 py-2 rounded-lg text-[9px] font- deep midnight blue uppercase tracking-widest hover:bg-green-600 hover:text-white transition">Mark as Solved</button>
            </div>
        </header>

        <div class="flex-1 flex overflow-hidden">
            <!-- Left: Case Details -->
            <div class="w-[40%] p-8 overflow-y-auto custom-scroll border-r border-white/5 bg-black/10">
                <div id="case-details-area">
                    <div class="h-full flex flex-col items-center justify-center opacity-20 text-center">
                        <span class="text-4xl mb-4">📂</span>
                        <p class="text-xs font-bold uppercase tracking-widest">Awaiting Ticket Data</p>
                    </div>
                </div>
            </div>

            <!-- Right: Chat Window -->
            <div class="w-[60%] flex flex-col relative">
                <div id="chat-window" class="flex-1 p-8 overflow-y-auto custom-scroll space-y-4 chat-window">
                    <div class="text-center py-20">
                        <p class="text-[10px] text-gray-600 font-black uppercase tracking-[0.3em]">Secure Bold.ng Tunnel</p>
                    </div>
                </div>
                
                <div class="p-6 border-t border-white/5 bg-black/40">
                    <div class="flex gap-4">
                        <input id="agent-msg-input" type="text" placeholder="Type response..." class="flex-1 bg-white/5 border border-white/10 rounded-2xl p-4 text-xs outline-none focus:border-blue-600 transition">
                        <button onclick="sendReply()" class="bg-blue-600 hover:bg-blue-700 px-8 rounded-2xl font-black text-[10px] uppercase tracking-widest transition">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentTicketId = null;
        let tickets = JSON.parse(localStorage.getItem('ticketHistory') || '[]');

        // 1. LISTEN FOR NEW TICKETS FROM CUSTOMER
        window.addEventListener('storage', (e) => {
            if (e.key === 'latestTicket') {
                const newTicket = JSON.parse(e.newValue);
                // Avoid duplicates
                if (!tickets.find(t => t.id === newTicket.id)) {
                    newTicket.status = 'awaiting';
                    newTicket.timestamp = new Date().toLocaleString();
                    tickets.unshift(newTicket);
                    saveAndRefresh();
                }
            }
            if (e.key === 'customerChat' && currentTicketId) {
                renderChatMessage('CUSTOMER', JSON.parse(e.newValue).text, 'bg-white/10');
            }
        });

        function saveAndRefresh() {
            localStorage.setItem('ticketHistory', JSON.stringify(tickets));
            renderTicketList('awaiting');
            updateCounters();
        }

        function updateCounters() {
            document.getElementById('count-awaiting').innerText = tickets.filter(t => t.status === 'awaiting').length;
            document.getElementById('count-solved').innerText = tickets.filter(t => t.status === 'solved').length;
        }

        // 2. RENDER SIDEBAR
        function renderTicketList(filter) {
            const listArea = document.getElementById('ticket-list');
            const filtered = tickets.filter(t => t.status === filter);
            
            if (filtered.length === 0) {
                listArea.innerHTML = `<div class="p-10 text-center text-[10px] text-gray-600 uppercase font-bold">No ${filter} logs</div>`;
                return;
            }

            listArea.innerHTML = filtered.map(t => `
                <div onclick="selectTicket('${t.id}')" class="ticket-item p-5 border-b border-white/5 cursor-pointer hover:bg-white/5 ${currentTicketId === t.id ? 'active' : ''}">
                    <div class="flex justify-between items-start mb-1">
                        <span class="text-[10px] font-black text-blue-500">${t.id}</span>
                        <span class="text-[8px] text-gray-500">${t.time || ''}</span>
                    </div>
                    <p class="text-[11px] font-bold truncate">${t.category}</p>
                    <p class="text-[10px] text-gray-500 truncate mt-1 italic">"${t.message}"</p>
                </div>
            `).join('');
        }

        // 3. SELECT AND LOAD TICKET
        function selectTicket(id) {
            currentTicketId = id;
            const ticket = tickets.find(t => t.id === id);
            
            // Header Update
            document.getElementById('ticket-header-title').innerText = `${ticket.category} | ${ticket.id}`;
            document.getElementById('ticket-header-sub').classList.remove('hidden');
            document.getElementById('status-indicator').className = "status-dot bg-blue-600 animate-pulse";

            // Details Update
            document.getElementById('case-details-area').innerHTML = `
                <div class="space-y-6">
                    <h3 class="text-3xl font-black italic uppercase tracking-tighter">Case Brief</h3>
                    <div class="glass-card p-6 rounded-2xl border-l-4 border-blue-600">
                        <p class="text-[10px] font-black text-blue-500 uppercase mb-2">Customer Narrative</p>
                        <p class="text-xs leading-relaxed text-gray-300">"${ticket.message}"</p>
                    </div>

                    ${ticket.attachment ? `
                        <div class="bg-white/5 border border-white/10 p-4 rounded-xl">
                            <p class="text-[9px] font-black text-gray-500 uppercase mb-3 tracking-widest">Evidence Attached</p>
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <span class="text-xl">📄</span>
                                    <span class="text-[10px] font-bold">${ticket.attachment}</span>
                                </div>
                                <button onclick="openFile()" class="text-[9px] font-black text-blue-500 underline">VIEW</button>
                            </div>
                        </div>
                    ` : ''}
                    
                    <div class="text-[9px] text-gray-600 font-bold uppercase tracking-widest pt-4">
                        Logged: ${ticket.timestamp}
                    </div>
                </div>
            `;
            
            // Clear Chat and show initial message
            document.getElementById('chat-window').innerHTML = `
                <div class="bg-white/5 p-4 rounded-2xl rounded-tl-none max-w-[80%] text-[11px]">
                    <p class="text-[8px] font-black text-gray-500 uppercase mb-1">SYSTEM</p>
                    Ticket opened. Chat connection established.
                </div>
            `;
            
            renderTicketList(ticket.status);
        }

        function openFile() {
            alert("BOLD SECURE VIEW: Opening encrypted attachment. (Note: In production, this would trigger a download or modal viewer)");
        }

        // 4. CHAT LOGIC
        function sendReply() {
            const input = document.getElementById('agent-msg-input');
            const msg = input.value.trim();
            if (!msg || !currentTicketId) return;

            localStorage.setItem('agentReply', JSON.stringify({ text: msg, time: Date.now() }));
            renderChatMessage('AGENT', msg, 'ml-auto bg-blue-600');
            input.value = "";
        }

        function renderChatMessage(sender, text, style) {
            const bubble = document.createElement('div');
            bubble.className = `${style} p-4 rounded-2xl max-w-[85%] text-[11px] fade-in border border-white/5`;
            bubble.innerHTML = `<p class="text-[8px] font-black uppercase opacity-50 mb-1">${sender}</p>${text}`;
            const chat = document.getElementById('chat-window');
            chat.appendChild(bubble);
            chat.scrollTop = chat.scrollHeight;
        }

        // 5. RESOLVE TICKET
        function resolveCurrentTicket() {
            if(!currentTicketId) return;
            const index = tickets.findIndex(t => t.id === currentTicketId);
            tickets[index].status = 'solved';
            saveAndRefresh();
            
            // Reset UI
            currentTicketId = null;
            document.getElementById('case-details-area').innerHTML = `<div class="p-20 text-center opacity-20 italic text-sm">Ticket Solved & Archived.</div>`;
            document.getElementById('chat-window').innerHTML = "";
            document.getElementById('ticket-header-title').innerText = "Listening for tickets...";
            document.getElementById('ticket-header-sub').classList.add('hidden');
            document.getElementById('status-indicator').className = "status-dot bg-gray-600";
        }

        window.onload = () => {
            updateCounters();
            renderTicketList('awaiting');
        };
    </script>
</body>
</html>
