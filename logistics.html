<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logistics | Bold Managed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #0a0a0b; color: white; }</style>
</head>
<body class="p-10">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-black mb-10 italic">ACTIVE SHIPMENTS</h1>
        
        <div class="relative border-l border-blue-600/30 ml-4 space-y-12">
            <div class="relative pl-8">
                <div class="absolute -left-1.5 w-3 h-3 bg-blue-600 rounded-full"></div>
                <p class="text-xs font-black text-blue-500 uppercase">In Progress</p>
                <h3 class="text-lg font-bold">Restock Order #RS-880</h3>
                <p class="text-sm text-gray-400">Driver is 5km away from your warehouse location.</p>
            </div>
            
            <div class="relative pl-8 opacity-50">
                <div class="absolute -left-1.5 w-3 h-3 bg-gray-600 rounded-full"></div>
                <p class="text-xs font-black text-gray-500 uppercase">Delivered</p>
                <h3 class="text-lg font-bold">Batch Pickup #PU-441</h3>
                <p class="text-sm text-gray-400">Completed on May 10, 2026.</p>
            </div>
        </div>

        <button onclick="history.back()" class="mt-20 w-full py-4 bg-white/5 rounded-2xl font-bold hover:bg-white/10 transition">Return to Home</button>
    </div>
</body>
</html>
