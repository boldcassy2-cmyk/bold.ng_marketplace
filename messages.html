<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bold.ng | Messages</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="flex flex-col">

    <!-- Header / Navigation -->
    <nav class="shrink-0 bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 orange-grad rounded-xl flex items-center justify-center font-bold text-white shadow-lg">B</div>
            <div>
                <h1 class="text-lg font-bold leading-none">Bold.ng</h1>
                <span class="text-xs text-slate-500">Business Messenger</span>
            </div>
        </div>
        <div class="flex gap-2">
            <!-- Link to Marketplace -->
            <a href="marketplace.html" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition-all">
                <i data-lucide="shopping-bag" class="w-4 h-4 text-orange-500"></i> Marketplace
            </a>
            <a href="cart.html" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition-all">
                <i data-lucide="shopping-cart" class="w-4 h-4 text-orange-500"></i> Orders
            </a>
        </div>
    </nav>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar: User List -->
        <aside class="w-80 border-r border-slate-800 bg-slate-900/50 hidden md:flex flex-col">
            <div class="p-4">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-slate-500"></i>
                    <input type="text" placeholder="Search chats..." class="w-full bg-slate-800 border-none rounded-lg py-2 pl-10 pr-4 text-sm focus:ring-1 focus:ring-orange-500 outline-none">
                </div>
            </div>
            <div class="flex-1 overflow-y-auto custom-scrollbar">
                <div class="p-3 mx-2 rounded-xl bg-orange-500/10 border border-orange-500/20 mb-1 cursor-pointer">
                    <div class="flex items-center gap-3">
                        <div class="w-11 h-11 rounded-full bg-slate-700 flex items-center justify-center font-bold">JD</div>
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-baseline">
                                <h4 class="text-sm font-bold truncate">John Doe</h4>
                                <span class="text-[10px] text-orange-500">2m ago</span>
                            </div>
                            <p class="text-xs text-slate-400 truncate">Is the MacBook Air still available?</p>
                        </div>
                    </div>
                </div>
                <!-- Mock list items -->
                <div id="sidebar-list"></div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col bg-slate-950/50 relative">
            <!-- Chat Header -->
            <div class="p-4 border-b border-slate-800 bg-slate-900/30 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center font-bold">JD</div>
                    <div>
                        <h2 class="text-sm font-bold">John Doe</h2>
                        <span class="text-[10px] text-emerald-500 flex items-center gap-1">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Online
                        </span>
                    </div>
                </div>
                <div class="flex gap-4">
                    <!-- Active Call Button (tel link) -->
                    <a href="tel:+2348000000000" class="text-slate-400 hover:text-orange-500 transition-colors p-2">
                        <i data-lucide="phone" class="w-5 h-5"></i>
                    </a>
                    <button class="text-slate-400 hover:text-white p-2"><i data-lucide="video" class="w-5 h-5"></i></button>
                    <button class="text-slate-400 hover:text-white p-2"><i data-lucide="more-vertical" class="w-5 h-5"></i></button>
                </div>
            </div>

            <!-- Messages Stream -->
            <div id="message-container" class="flex-1 overflow-y-auto p-6 space-y-4 custom-scrollbar scroll-smooth">
                <div class="flex justify-center"><span class="bg-slate-800 text-slate-500 text-[10px] px-3 py-1 rounded-full uppercase tracking-widest">Today</span></div>
                
                <div class="flex items-end gap-2 max-w-[80%]">
                    <div class="w-8 h-8 rounded-full bg-slate-800 shrink-0 border border-slate-700"></div>
                    <div class="bg-slate-800 p-3 rounded-2xl rounded-bl-none text-sm border border-slate-700">
                        Hello! I saw the MacBook Air 15" on your marketplace. Is it available for pickup today?
                    </div>
                </div>

                <div class="flex flex-col items-end gap-1">
                    <div class="bg-orange-600 p-3 rounded-2xl rounded-br-none text-sm max-w-[80%] shadow-lg">
                        Yes, it is! We have 2 units left in stock at our Ikeja branch.
                    </div>
                    <span class="text-[10px] text-slate-600 px-1">Read 2:14 PM</span>
                </div>
                
                <!-- Spacer to allow scrolling -->
                <div class="h-40"></div>
            </div>

            <!-- Message Input -->
            <div class="p-4 bg-slate-900 border-t border-slate-800">
                <div class="flex items-center gap-3 bg-slate-800 rounded-2xl px-4 py-2 border border-slate-700 focus-within:border-orange-500 transition-all">
                    <button class="text-slate-500 hover:text-orange-500 transition-colors shrink-0">
                        <i data-lucide="plus-circle" class="w-5 h-5"></i>
                    </button>
                    <input type="text" id="msg-input" placeholder="Type a message..." class="flex-1 bg-transparent border-none outline-none py-2 text-sm text-white">
                    <button class="text-slate-500 hover:text-orange-500 transition-colors shrink-0">
                        <i data-lucide="smile" class="w-5 h-5"></i>
                    </button>
                    <!-- Visible Send Button -->
                    <button id="send-btn" class="w-10 h-10 orange-grad rounded-xl flex items-center justify-center text-white shadow-lg hover:scale-105 active:scale-95 transition-all shrink-0">
                        <i data-lucide="send" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Scroll Up/Down Floating Buttons -->
    <div id="scroll-up" class="scroll-btn" style="bottom: 150px;">
        <i data-lucide="chevron-up"></i>
    </div>
    <div id="scroll-down" class="scroll-btn" style="bottom: 95px;">
        <i data-lucide="chevron-down"></i>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Elements
        const container = document.getElementById('message-container');
        const scrollUpBtn = document.getElementById('scroll-up');
        const scrollDownBtn = document.getElementById('scroll-down');
        const sendBtn = document.getElementById('send-btn');
        const msgInput = document.getElementById('msg-input');

        // Scroll functionality
        scrollUpBtn.addEventListener('click', () => {
            container.scrollTo({ top: 0, behavior: 'smooth' });
        });

        scrollDownBtn.addEventListener('click', () => {
            container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
        });

        // Send functionality (Simple UI feedback)
        sendBtn.addEventListener('click', () => {
            if(msgInput.value.trim() !== "") {
                const newMsg = `
                    <div class="flex flex-col items-end gap-1">
                        <div class="bg-orange-600 p-3 rounded-2xl rounded-br-none text-sm max-w-[80%] shadow-lg">
                            ${msgInput.value}
                        </div>
                        <span class="text-[10px] text-slate-600 px-1">Just now</span>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', newMsg);
                msgInput.value = "";
                container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
            }
        });

        // Mock sidebar items
        const sidebar = document.getElementById('sidebar-list');
        const initials = ['SA', 'MK', 'OL', 'TY', 'BN', 'CV', 'WE', 'RE'];
        for(let i=0; i<8; i++) {
            sidebar.innerHTML += `
                <div class="p-3 mx-2 rounded-xl hover:bg-slate-800/50 cursor-pointer transition-all">
                    <div class="flex items-center gap-3">
                        <div class="w-11 h-11 rounded-full bg-slate-800 flex items-center justify-center text-slate-500 font-bold border border-slate-700">${initials[i]}</div>
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-baseline">
                                <h4 class="text-sm font-medium truncate">Client #${1024 + i}</h4>
                                <span class="text-[10px] text-slate-500">${i+1}h ago</span>
                            </div>
                            <p class="text-xs text-slate-500 truncate">Payment confirmed for order #${44512 + i}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // Auto-scroll to bottom on load
        window.onload = () => {
            container.scrollTop = container.scrollHeight;
        };
    </script>
</body>
</html>
