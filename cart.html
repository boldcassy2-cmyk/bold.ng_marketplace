<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bold Basket | Secure Escrow</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0b] text-white">

    <nav class="p-6 border-b border-white/10 flex justify-between items-center px-[5%] backdrop-blur-md sticky top-0 z-50">
        <div onclick="window.location.href='index.html'" class="cursor-pointer flex items-center gap-2">
            <div class="bg-[#f57c00] px-2 rounded font-black">B</div>
            <span class="font-bold tracking-tighter text-xl">bold.ng</span>
        </div>
        <h1 class="text-sm font-bold tracking-[0.2em] text-gray-500 uppercase">Secure Checkout Pipeline</h1>
        <a href="marketplace.html" class="text-xs hover:text-[#f57c00] transition">Continue Sourcing</a>
    </nav>

    <main class="container mx-auto p-8 max-w-5xl">
        <div class="flex items-center gap-4 mb-10">
            <h2 class="text-4xl font-black">Your <span class="text-[#f57c00]">Bold</span> Basket</h2>
            <span class="bg-green-500/10 text-green-500 text-[10px] font-bold px-3 py-1 rounded-full border border-green-500/20">ESCROW PROTECTED</span>
        </div>

        <div class="grid lg:grid-cols-3 gap-10">
            <div id="cartItems" class="lg:col-span-2 space-y-6">
                </div>

            <div class="space-y-6">
                <div class="bg-white/5 border border-white/10 p-8 rounded-3xl sticky top-28">
                    <h3 class="text-xl font-bold mb-6">Order Summary</h3>
                    <div class="space-y-4 text-sm opacity-70">
                        <div class="flex justify-between"><span>Subtotal</span> <span id="subtotal">₦0</span></div>
                        <div class="flex justify-between"><span>Inspection Fee (Lagos Hub)</span> <span>₦0</span></div>
                        <div class="flex justify-between"><span>Logistics/Shipping</span> <span class="text-green-500">Calculated later</span></div>
                    </div>
                    <div class="border-t border-white/10 my-6 pt-6 flex justify-between items-end">
                        <span class="font-bold">Total Amount</span>
                        <span id="grandTotal" class="text-3xl font-black text-[#f57c00]">₦0</span>
                    </div>
                    <button onclick="window.location.href='checkout_payment.html'" class="w-full bg-[#f57c00] py-5 rounded-2xl font-black text-lg hover:shadow-[0_0_20px_rgba(245,124,0,0.3)] transition">
                        PROCEED TO PAYMENT
                    </button>
                    <p class="text-[10px] text-center mt-4 text-gray-500">Payments are held in Escrow until delivery is confirmed.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('boldCart')) || [];
            const container = document.getElementById('cartItems');
            let total = 0;

            if(cart.length === 0) {
                container.innerHTML = `<div class="py-20 text-center opacity-30">Your basket is empty.</div>`;
                return;
            }

            container.innerHTML = cart.map((item, idx) => {
                total += Number(item.price);
                return `
                    <div class="bg-white/5 border border-white/10 p-6 rounded-3xl flex gap-6 items-center">
                        <img src="${item.image}" class="w-32 h-32 object-cover rounded-2xl border border-white/5">
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <div>
                                    <span class="text-[10px] text-[#f57c00] font-bold tracking-widest uppercase">${item.category}</span>
                                    <h4 class="text-xl font-bold">${item.name}</h4>
                                </div>
                                <button onclick="removeItem(${idx})" class="text-red-500 text-xs font-bold hover:underline">Remove Asset</button>
                            </div>
                            <div class="mt-4 flex justify-between items-end">
                                <p class="text-2xl font-black text-[#f57c00]">₦${Number(item.price).toLocaleString()}</p>
                                <span class="text-[9px] text-gray-500 bg-white/5 px-2 py-1 rounded">ID: ${item.id}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('subtotal').innerText = "₦" + total.toLocaleString();
            document.getElementById('grandTotal').innerText = "₦" + total.toLocaleString();
        }

        function removeItem(idx) {
            let cart = JSON.parse(localStorage.getItem('boldCart')) || [];
            cart.splice(idx, 1);
            localStorage.setItem('boldCart', JSON.stringify(cart));
            renderCart();
        }

        renderCart();
    </script>
</body>
</html>
