<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Global Marketplace | Bold.ng</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0b] text-white font-sans">

    <nav class="glass-header sticky top-0 z-[1000] p-6 flex justify-between items-center px-[5%]">
        <div class="flex items-center gap-4">
            <div class="bg-[#f57c00] text-white font-black p-2 rounded">B</div>
            <span class="text-xl font-bold tracking-tighter">bold.ng</span>
        </div>
        <div class="flex-1 max-w-xl mx-10">
            <input type="text" id="globalSearch" onkeyup="searchItems()" placeholder="Search billions of items (Caterpillars, Fashion, Tickets...)" 
                   class="w-full bg-white/5 border border-white/10 p-3 rounded-full px-6 focus:border-[#f57c00] outline-none">
        </div>
        <div class="flex items-center gap-6">
            <a href="cart.html" class="relative">
                🛒 <span id="cartCount" class="absolute -top-2 -right-2 bg-[#f57c00] text-[10px] px-2 rounded-full">0</span>
            </a>
            <a href="dashboard.html" class="text-sm opacity-70 hover:opacity-100">Merchant Hub</a>
        </div>
    </nav>

    <main class="container mx-auto p-8">
        <section class="premium-card p-10 rounded-3xl mb-12 border-dashed border-2 border-[#f57c00]/30">
            <h2 class="text-3xl font-black mb-6 text-center text-[#f57c00]">LIST YOUR ASSET</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <input type="text" id="pName" placeholder="Product Name" class="bg-black border border-white/10 p-4 rounded-xl">
                <input type="number" id="pPrice" placeholder="Price (₦)" class="bg-black border border-white/10 p-4 rounded-xl">
                
                <select id="pCategory" onchange="toggleExtraFields()" class="bg-black border border-white/10 p-4 rounded-xl">
                    <option value="General">General Category</option>
                    <option value="Machinery">Heavy Machinery (Caterpillar/Crane)</option>
                    <option value="Travel">Aviation/Tickets</option>
                    <option value="Fashion">Fashion & Apparel</option>
                </select>

                <div id="extraFields" class="md:col-span-3 grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
                    <input type="text" id="pSpec1" placeholder="Year of Manufacture / Size" class="bg-black border border-white/10 p-4 rounded-xl">
                    <input type="text" id="pSpec2" placeholder="Operating Hours / Material" class="bg-black border border-white/10 p-4 rounded-xl">
                </div>

                <input type="text" id="pImg" placeholder="High-Res Image URL" class="md:col-span-2 bg-black border border-white/10 p-4 rounded-xl">
                <button onclick="handleUpload()" class="bg-[#f57c00] font-black py-4 rounded-xl hover:scale-[1.02] transition">PUBLISH WORLDWIDE</button>
            </div>
        </section>

        <div id="marketGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
    </main>

    <script>
        function toggleExtraFields() {
            const cat = document.getElementById('pCategory').value;
            const extra = document.getElementById('extraFields');
            extra.classList.toggle('hidden', cat === 'General');
        }

        let products = JSON.parse(localStorage.getItem('boldProducts')) || [];

        function handleUpload() {
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const cat = document.getElementById('pCategory').value;
            const img = document.getElementById('pImg').value || 'https://via.placeholder.com/600';

            if(!name || !price) return alert("Missing particulars!");

            const newProduct = {
                id: Date.now().toString(),
                name, price, category: cat, image: img,
                specs: [document.getElementById('pSpec1').value, document.getElementById('pSpec2').value]
            };

            products.unshift(newProduct);
            localStorage.setItem('boldProducts', JSON.stringify(products));
            location.reload();
        }

        function render(data = products) {
            const grid = document.getElementById('marketGrid');
            grid.innerHTML = data.map(p => `
                <div class="premium-card p-4 rounded-2xl cursor-pointer group" onclick="window.location.href='product_details.html?id=${p.id}'">
                    <div class="overflow-hidden rounded-xl mb-4 h-56">
                        <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                    </div>
                    <span class="text-[10px] text-[#f57c00] font-bold uppercase tracking-widest">${p.category}</span>
                    <h3 class="text-xl font-bold mt-1">${p.name}</h3>
                    <p class="text-2xl font-black text-[#f57c00] mt-2">₦${Number(p.price).toLocaleString()}</p>
                </div>
            `).join('');
            updateCartCount();
        }

        function searchItems() {
            const query = document.getElementById('globalSearch').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query));
            render(filtered);
        }

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('boldCart')) || [];
            document.getElementById('cartCount').innerText = cart.length;
        }

        render();
    </script>
</body>
</html>
