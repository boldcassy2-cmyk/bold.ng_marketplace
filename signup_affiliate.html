<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Affiliate Signup | Bold.ng</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0b] text-white p-6">
    <div class="max-w-xl mx-auto py-12 text-center">
        <h2 class="text-3xl font-black mb-2 text-green-500">AFFILIATE PARTNER</h2>
        <p class="text-gray-500 text-xs mb-10">Commission Based • Internal Tracking Only</p>

        <form onsubmit="event.preventDefault(); window.location.href='affiliate_hub.html'" class="space-y-4 max-w-sm mx-auto">
            <input type="text" placeholder="Full Name" class="bg-white/5 border border-white/10 p-4 rounded-2xl w-full outline-none">
            <input type="tel" placeholder="Phone Number" class="bg-white/5 border border-white/10 p-4 rounded-2xl w-full outline-none">
            <input type="email" placeholder="Email Address" class="bg-white/5 border border-white/10 p-4 rounded-2xl w-full outline-none">
            <input type="password" placeholder="Create Password" class="bg-white/5 border border-white/10 p-4 rounded-2xl w-full outline-none">
            
            <button class="w-full bg-green-600 text-white font-black py-5 rounded-2xl mt-6">START EARNING COMMISSION</button>
        </form>
    </div>
</body>
</html>
