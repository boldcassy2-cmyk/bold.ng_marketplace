<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment | Bold.ng</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background-color: var(--bold-midnight); color: var(--bold-white);">

    <nav class="main-nav">
        <div style="display: flex; align-items: center; gap: 15px;">
            <div onclick="history.back()" style="cursor: pointer; color: var(--bold-orange); font-size: 1.5rem;">←</div>
            <div class="bold-logo-box">B</div>
            <span style="font-weight: 800;">Secure Checkout</span>
        </div>
    </nav>

    <main class="container" style="padding: 40px 5%; max-width: 800px; margin: 0 auto;">
        <div class="glass-panel animate-slide">
            <h2 style="color: var(--bold-orange);">Payment Method</h2>
            <p style="color: #94a3b8; margin-bottom: 30px;">All transactions are protected by Bold Escrow™</p>

            <div style="display: grid; gap: 15px;">
                <label class="glass-panel" style="display: flex; align-items: center; gap: 15px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1);">
                    <input type="radio" name="pay" checked>
                    <span>🏦 Bank Transfer (Most Popular in Africa)</span>
                </label>
                <label class="glass-panel" style="display: flex; align-items: center; gap: 15px; cursor: pointer;">
                    <input type="radio" name="pay">
                    <span>💳 Debit/Credit Card (Visa, Mastercard, Verve)</span>
                </label>
                <label class="glass-panel" style="display: flex; align-items: center; gap: 15px; cursor: pointer;">
                    <input type="radio" name="pay">
                    <span>🟠 Bold Wallet (Balance: ₦0.00)</span>
                </label>
            </div>

            <div style="margin-top: 30px; padding: 20px; background: rgba(255, 95, 0, 0.1); border-radius: 8px;">
                <p style="margin: 0; font-size: 0.9rem;">
                    <strong>Note:</strong> Your money is held safely. The seller will only be paid after you receive and confirm the item.
                </p>
            </div>

            <button class="btn-bold" style="width: 100%; margin-top: 30px; padding: 20px; font-size: 1.2rem;" onclick="showSuccess()">
                Confirm & Pay ₦85,008,000
            </button>
        </div>
    </main>

    <div id="successScreen" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bold-midnight); z-index: 2000; flex-direction: column; align-items: center; justify-content: center;">
        <div style="font-size: 5rem;">✅</div>
        <h1 style="color: var(--bold-orange);">Payment Successful!</h1>
        <p>Your order is now in <strong>Escrow Protection</strong>.</p>
        <button class="btn-bold" onclick="window.location.href='index.html'" style="margin-top: 20px;">Back to Home</button>
    </div>

    <script>
        function showSuccess() {
            document.getElementById('successScreen').style.display = 'flex';
        }
    </script>

</body>
</html>
