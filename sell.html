<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Professional Seller Portal | Bold.ng</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-input {
            background: rgba(255, 255, 255, 0.03) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 16px;
            padding: 16px;
            width: 100%;
            outline: none;
            transition: 0.3s;
        }
        .glass-input:focus { border-color: #f57c00 !important; background: rgba(255,255,255,0.07) !important; }
        .dynamic-section { display: none; animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .upload-box { border: 2px dashed #333; transition: 0.3s; cursor: pointer; }
        .upload-box:hover { border-color: #f57c00; background: #f57c0005; }
    </style>
</head>
<body class="bg-[#0a0a0b] text-white p-4 md:p-10">

    <main class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-4xl font-black italic">SELL ON <span class="text-[#f57c00]">BOLD</span></h1>
                <p class="text-gray-500 font-bold text-xs uppercase tracking-widest mt-2">Verified Merchant Listing Portal</p>
            </div>
            <button onclick="window.history.back()" class="bg-white/5 px-6 py-2 rounded-full text-[10px] font-bold border border-white/10">CANCEL</button>
        </header>

        <div class="grid lg:grid-cols-3 gap-10">
            
            <div class="space-y-8">
                <section>
                    <label class="text-[10px] font-black text-gray-500 mb-4 block tracking-[0.2em]">MEDIA ASSETS</label>
                    <div class="upload-box rounded-[32px] p-10 text-center" onclick="document.getElementById('fileIn').click()">
                        <span class="text-3xl block mb-2">📸</span>
                        <p class="text-sm font-bold text-gray-400">Drag & Drop or Click</p>
                        <input type="file" id="fileIn" hidden multiple>
                    </div>
                </section>

                <section>
                    <label class="text-[10px] font-black text-gray-500 mb-4 block tracking-[0.2em]">LISTING PLAN</label>
                    <div class="space-y-3">
                        <label class="block p-4 rounded-2xl border border-white/10 cursor-pointer has-[:checked]:border-[#f57c00] has-[:checked]:bg-[#f57c00]/5">
                            <input type="radio" name="plan" checked class="hidden">
                            <p class="font-bold text-sm">Free Listing</p>
                            <p class="text-[9px] text-gray-500">Standard visibility</p>
                        </label>
                        <label class="block p-4 rounded-2xl border border-white/10 cursor-pointer has-[:checked]:border-[#f57c00] has-[:checked]:bg-[#f57c00]/5">
                            <input type="radio" name="plan" class="hidden">
                            <p class="font-bold text-sm text-[#f57c00]">Premium Boost</p>
                            <p class="text-[9px] text-gray-500">Top of category for 7 days</p>
                        </label>
                    </div>
                </section>
            </div>

            <div class="lg:col-span-2 space-y-6">
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="text-xs font-bold text-gray-500 mb-2 block">Item Title</label>
                        <input type="text" placeholder="Be specific (e.g. 2024 iPhone 15 Pro Max 256GB)" class="glass-input">
                    </div>
                    
                    <div class="col-span-2">
                        <label class="text-xs font-bold text-gray-500 mb-2 block">Primary Category</label>
                        <select onchange="toggleCategory(this.value)" class="glass-input">
                            <option value="">Select Category</option>
                            <option value="vehicle">Vehicles (Cars, Buses, Heavy Duty)</option>
                            <option value="electronics">Electronics & Computers</option>
                            <option value="phones">Phones & Tablets</option>
                            <option value="fashion">Fashion (Men, Women, Kids)</option>
                            <option value="handwork">Handwork & Services</option>
                            <option value="property">Properties (Real Estate)</option>
                            <option value="jobs">Jobs & Employment</option>
                            <option value="furniture">Furniture & Decor</option>
                            <option value="health">Health & Beauty Services</option>
                            <option value="agriculture">Agriculture & Food</option>
                        </select>
                    </div>
                </div>

                <div class="bg-white/5 p-8 rounded-[40px] border border-white/10">
                    
                    <div id="sec-vehicle" class="dynamic-section space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <select class="glass-input"><option>Car</option><option>Bus</option><option>Luxury</option><option>Caterpillar/Heavy Duty</option></select>
                            <input type="text" placeholder="Year" class="glass-input">
                            <input type="text" placeholder="Color" class="glass-input">
                            <select class="glass-input"><option>Brand New</option><option>Tokunbo</option><option>Used</option></select>
                        </div>
                    </div>

                    <div id="sec-phones" class="dynamic-section space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" placeholder="Storage (GB/TB)" class="glass-input">
                            <input type="text" placeholder="Color" class="glass-input">
                            <input type="text" placeholder="Battery Health %" class="glass-input">
                            <select class="glass-input"><option>New</option><option>Used (Mint)</option><option>Used (Cracked)</option></select>
                        </div>
                    </div>

                    <div id="sec-fashion" class="dynamic-section space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <select class="glass-input"><option>Men's Wear</option><option>Women's Wear</option><option>Babies & Children</option></select>
                            <select class="glass-input"><option>Clothes</option><option>Shoes</option><option>Accessories</option></select>
                            <input type="text" placeholder="Size (XL, 42, etc)" class="glass-input">
                        </div>
                    </div>

                    <div id="sec-handwork" class="dynamic-section space-y-4">
                        <input type="text" placeholder="Type of Handwork (e.g. Plumbing, Tailoring)" class="glass-input">
                        <select class="glass-input"><option>On-site Service</option><option>Remote</option></select>
                    </div>

                    <div class="mt-6 space-y-4">
                        <textarea placeholder="Detailed Description (Tell the buyer everything...)" class="glass-input h-32"></textarea>
                        <div class="grid grid-cols-2 gap-4">
                            <input type="number" placeholder="Price (₦)" class="glass-input font-bold text-[#f57c00]">
                            <select class="glass-input"><option>Fixed Price</option><option>Negotiable</option></select>
                        </div>
                    </div>

                    <button class="w-full bg-[#f57c00] text-black font-black py-5 rounded-2xl mt-8 hover:scale-[1.02] transition shadow-lg shadow-[#f57c00]/20">
                        CONFIRM & POST AD
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        function toggleCategory(val) {
            // Hide all sections
            document.querySelectorAll('.dynamic-section').forEach(s => s.style.display = 'none');
            
            // Show selected section
            const target = document.getElementById('sec-' + val);
            if(target) target.style.display = 'block';
        }
    </script>
</body>
</html>
