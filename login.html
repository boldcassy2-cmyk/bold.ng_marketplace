<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access Gateway | Bold.ng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Central Style Connection -->
    <link rel="stylesheet" href="styles.css">
    <style>
        .toast { transform: translateY(100px); opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative overflow-x-hidden">

    <div class="accent-glow-spot" style="bottom: -10%; left: -10%;"></div>

    <!-- UNIFORM NAVIGATION HEADER -->
    <nav class="main-nav">
        <div class="nav-action-cluster">
            <button class="nav-arrow-btn" onclick="history.back()">←</button>
            <button class="nav-arrow-btn" onclick="history.forward()">→</button>
            <a href="index.html" class="logo-area">
                <div class="bold-logo-box">B</div>
                <span class="logo-text">Bold<span>.ng</span></span>
            </a>
        </div>
        <div class="nav-links-wrapper">
            <a href="marketplace.html">Marketplace</a>
            <a href="signup.html">Join</a>
            <a href="index.html" class="house-menu-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </a>
        </div>
    </nav>

    <!-- SECURE INTERFACE CARRIER PANEL -->
    <main class="flex-1 flex items-center justify-center p-4 z-10">
        <div class="w-full max-w-md glass-panel rounded-[24px] md:rounded-[32px] p-6 md:p-10 shadow-2xl">
            
            <div class="text-center mb-6">
                <h2 class="text-xl md:text-2xl font-bold uppercase tracking-tight text-white">Welcome Back</h2>
                <p class="text-xs text-gray-500 mt-1">Provide your verified account key values to proceed.</p>
            </div>

            <form id="loginForm" onsubmit="executeAuthenticationRoute(event)" class="space-y-5">
                
                <div>
                    <label class="text-[10px] font-bold uppercase tracking-wider text-gray-400 block mb-2">Email Address</label>
                    <input type="email" id="loginEmail" required class="field-input-base text-sm" placeholder="name@domain.com">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-gray-400 block">Password</label>
                        <a href="forgot-password.html" class="text-[10px] font-bold uppercase tracking-wider text-[#ff6b00] hover:underline">Forgot?</a>
                    </div>
                    <!-- SECURE VISIBILITY ACCENT CONTAINER -->
                    <div class="relative">
                        <input type="password" id="loginPassword" required class="field-input-base text-sm pr-12" placeholder="••••••••">
                        <button type="button" onclick="toggleLoginPassword()" id="toggleBtn" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white text-xs font-semibold focus:outline-none">SHOW</button>
                    </div>
                </div>

                <button type="submit" class="w-full btn-bold-primary py-4 rounded-xl text-xs tracking-[0.2em]">
                    Verify & Access Workspace
                </button>

            </form>

            <div class="text-center mt-6 pt-5 border-t border-white/5">
                <p class="text-xs text-gray-500">New operator? <a href="signup.html" class="text-[#ff6b00] font-bold uppercase tracking-wide ml-1 hover:underline">Create Account →</a></p>
            </div>

        </div>
    </main>

    <footer style="background: #070a13;" class="py-4 px-5 border-t border-white/5 text-center z-10">
        <p class="text-[10px] text-gray-600 font-medium tracking-wide">&copy; 2026 Bold.ng Marketplace.</p>
    </footer>
</body>
<script>
    function toggleLoginPassword() {
        const passField = document.getElementById('loginPassword');
        const toggleBtn = document.getElementById('toggleBtn');
        if (passField.type === "password") {
            passField.type = "text"; toggleBtn.innerText = "HIDE"; toggleBtn.style.color = "#ff6b00";
        } else {
            passField.type = "password"; toggleBtn.innerText = "SHOW"; toggleBtn.style.color = "#64748b";
        }
    }
    function executeAuthenticationRoute(event) {
        event.preventDefault();
        const email = document.getElementById('loginEmail').value;
        let target = 'seller_dashboard.html';
        if (email.includes("merchant")) target = 'merchant_portal.html';
        if (email.includes("affiliate")) target = 'affiliate_hub.html';
        window.location.href = target;
    }
</script>
</html>
