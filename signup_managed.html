<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Managed Vendor Signup | Bold.ng</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0b] text-white p-6">
    <div class="max-w-xl mx-auto py-12">
        <h2 class="text-3xl font-black mb-2 text-blue-500">MANAGED VENDOR</h2>
        <p class="text-gray-500 text-xs mb-8">Admin Managed • Private Data Storage</p>

        <form onsubmit="event.preventDefault(); window.location.href='merchant_portal.html'" class="space-y-4">
            <input type="text" placeholder="Full Name" class="bg-white/5 border border-white/10 p-4 rounded-2xl w-full outline-none">
            <div class="grid grid-cols-2 gap-4">
                <input type="tel" placeholder="Phone Number" class="bg-white/5 border border-white/10 p-4 rounded-2xl w-full outline-none">
                <input type="tel" placeholder="WhatsApp Number" class="bg-white/5 border border-white/10 p-4 rounded-2xl w-full outline-none">
            </div>
            <input type="text" placeholder="Full Business Address" class="bg-white/5 border border-white/10 p-4 rounded-2xl w-full outline-none">
            
            <div class="p-6 bg-white/5 rounded-3xl border border-white/5 space-y-3">
                <p class="text-[10px] font-black text-gray-500">BANK SETTLEMENT (PRIVATE)</p>
                <input type="text" placeholder="Bank Name" class="bg-black/40 border border-white/10 p-3 rounded-xl w-full outline-none">
                <input type="text" placeholder="Account Number" class="bg-black/40 border border-white/10 p-3 rounded-xl w-full outline-none">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <input type="password" placeholder="Password" class="bg-white/5 border border-white/10 p-4 rounded-2xl w-full outline-none">
                <input type="password" placeholder="Verify Password" class="bg-white/5 border border-white/10 p-4 rounded-2xl w-full outline-none">
            </div>
            
            <button class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl">REGISTER VENDOR ACCOUNT</button>
        </form>
    </div>
</body>
</html>
