<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bold.ng - The Gold Standard of Trusted Marketplaces in Africa. Buy and Sell with absolute confidence.">
    <title>Bold.ng | Africa's Most Trusted Marketplace</title>
    <link rel="stylesheet" href="styles.css">
    </head>
<body class="bg-[#0a0a0b] text-white">
    <!-- Navigation -->
   <nav class="main-nav">
    <div class="logo-area" onclick="window.location.href='index.html'" style="cursor:pointer;">
        <span class="bold-logo-box">B</span>
        <span style="font-weight: 800; font-size: 1.5rem; margin-left: 10px;">old.ng</span>
    </div>
    <div class="nav-links">
        <a href="marketplace.html">Shop</a>
        <a href="login.html" class="btn-bold" style="padding: 8px 16px; text-decoration: none;">Login</a>
    </div>
</nav>
    <!-- Hero Section -->
    <header class="container mx-auto py-20 text-center">
        <h1 class="text-6xl font-black mb-4">Africa's Most <span class="text-[#f57c00]">Trusted</span> Hub.</h1>
        <p class="text-gray-400 text-xl mb-8">Verified electronics with 50-point technical inspection. No scams, just Bold quality.</p>
        <div class="flex justify-center gap-4">
            <a href="marketplace.html" class="bg-[#f57c00] text-white px-8 py-4 rounded-lg font-bold text-lg">Start Shopping</a>
            <a href="shop.html" class="border border-white px-8 py-4 rounded-lg font-bold text-lg">View Services</a>
        </div>
    </header>

    <script>
        // Universal Cart Counter
        const updateCount = () => {
            const cart = JSON.parse(localStorage.getItem('boldCart')) || [];
            document.getElementById('cartCount').innerText = cart.length;
        };
        updateCount();
    </script>
</body>
</html>
