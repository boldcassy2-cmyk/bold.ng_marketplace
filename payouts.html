<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payouts | Bold Managed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #0a0a0b; color: white; }</style>
</head>
<body class="p-10">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-black">Settlement History</h1>
            <button onclick="history.back()" class="text-xs font-bold text-gray-500">← CLOSE</button>
        </div>

        <div class="space-y-4">
            <!-- Payment Row -->
            <div class="bg-white/5 p-6 rounded-3xl flex justify-between items-center border border-white/5">
                <div>
                    <p class="text-[10px] text-gray-500 font-black">MAY 12, 2026</p>
                    <p class="font-bold text-lg">₦1,250,000.00</p>
                </div>
                <div class="text-right">
                    <span class="bg-green-500/10 text-green-500 text-[10px] px-3 py-1 rounded-full font-black">SUCCESSFUL</span>
                    <p class="text-[10px] text-gray-500 mt-2">Ref: BOLD-992031</p>
                </div>
            </div>
            
            <div class="bg-white/5 p-6 rounded-3xl flex justify-between items-center border border-white/5">
                <div>
                    <p class="text-[10px] text-gray-500 font-black">MAY 05, 2026</p>
                    <p class="font-bold text-lg">₦840,000.00</p>
                </div>
                <div class="text-right">
                    <span class="bg-green-500/10 text-green-500 text-[10px] px-3 py-1 rounded-full font-black">SUCCESSFUL</span>
                    <p class="text-[10px] text-gray-500 mt-2">Ref: BOLD-991844</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
